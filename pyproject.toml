[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "remnawave-block-monitor"
version = "1.0.0"
description = "Block and reachability monitor for Bedolaga + Remnawave infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Remnawave Block Monitor contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
remnawave-block-monitor = "remnawave_block_monitor.cli:main"

[tool.setuptools]
packages = ["remnawave_block_monitor"]
