name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax and tests
        run: |
          python -m compileall -q remnawave_block_monitor monitor.py tests
          python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh
      - name: systemd unit verification
        run: systemd-analyze verify systemd/remnawave-block-monitor.service
